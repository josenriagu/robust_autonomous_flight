[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robust_autonomous_flight"
version = "0.1.0"
description = "Simulation and research framework for robust autonomous flight"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]